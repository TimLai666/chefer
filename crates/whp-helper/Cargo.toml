[package]
name = "whp-helper"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "chefer-whp-helper"
path = "src/main.rs"

[dependencies]
# bundle/data 目錄 ↔ sector 對齊 tar image 轉換（virtio-blk backing；對齊生態 0.4.46）。
tar = "0.4.46"
# WHP virtio-net 的 host 端 user-mode 網路堆疊（純 Rust，無 C 依賴，符合單檔精神）：
# 當 guest 的 gateway，處理 ARP/IP/TCP/UDP；host→guest 埠轉發以其 TCP socket 橋接。
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # GUI 顯示視窗（M8-c）：視窗類別/訊息迴圈、GDI blit（StretchDIBits）。
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # 剪貼簿同步（M8-e）：Win32 clipboard API + token 用的 CSPRNG。
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_Security_Cryptography",
] }
