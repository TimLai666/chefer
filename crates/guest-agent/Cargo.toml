[package]
name = "guest-agent"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chefer-bundle = { version = "0.1.0", path = "../chefer-bundle" }
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
ruzstd = "0.8.3"
sha2 = "0.11.0"
tar = "0.4.46"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"
nix = { version = "0.31.3", features = ["fs", "mount", "sched", "signal", "process", "user", "term", "socket", "net", "uio"] }

[dev-dependencies]
tempfile = "3.27.0"
