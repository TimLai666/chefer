[package]
name = "guest-agent"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chefer-bundle = { version = "0.5.0", path = "../chefer-bundle" }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
ruzstd = "0.9.1"
sha2 = "0.11.1"
tar = "0.4.46"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
nix = { version = "0.31.3", features = ["fs", "mount", "sched", "signal", "process", "user", "term", "socket", "net", "uio"] }

[dev-dependencies]
tempfile = "3.27.0"
