[package]
name = "chefer-pack"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
appcipe-spec = { version = "0.1.0", path = "../appcipe-spec" }
# 解 docker config.json 的 auths.auth（base64 "user:pass"）；本就在依賴樹（oci-client 傳遞依賴）。
base64 = "0.22"
chefer-bundle = { version = "0.4.0", path = "../chefer-bundle" }
flate2 = "1.1.9"
fs-err = "3.3.0"
# registry pull（source: image）。rustls 對齊 workspace（chefer-cli 也用 rustls）。
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
time = { version = "0.3.47", features = ["formatting"] }
# 只為了在同步的 pack 流程裡 block_on oci-client 的 async pull。
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
zstd = "0.13.3"
