[package]
name = "chefer-pack"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
appcipe-spec = { version = "0.1.0", path = "../appcipe-spec" }
chefer-bundle = { version = "0.1.0", path = "../chefer-bundle" }
