[package]
name = "chefer-cli"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
appcipe-normalize = { version = "0.1.0", path = "../appcipe-normalize" }
appcipe-spec = { path = "../appcipe-spec" }
chefer-assembler = { version = "0.5.0", path = "../chefer-assembler" }
chefer-bundle = { version = "0.5.0", path = "../chefer-bundle" }
chefer-pack = { path = "../chefer-pack" }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
crossterm = "0.29.0"
flate2 = "1.1.10"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
vmm-backend = { version = "0.5.0", path = "../vmm-backend" }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
zstd = "0.14.3"

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
sha2 = "0.11.1"
tempfile = "3.27.0"
