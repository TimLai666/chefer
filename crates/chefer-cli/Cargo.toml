[package]
name = "chefer-cli"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
appcipe-normalize = { version = "0.1.0", path = "../appcipe-normalize" }
appcipe-spec = { path = "../appcipe-spec" }
chefer-assembler = { version = "0.2.0", path = "../chefer-assembler" }
chefer-bundle = { version = "0.2.0", path = "../chefer-bundle" }
chefer-pack = { path = "../chefer-pack" }
clap = { version = "4.5.43", features = ["derive"] }
comfy-table = "7.1.4"
crossterm = "0.29.0"
flate2 = "1.1.9"
owo-colors = "4.2.2"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "rustls-tls"] }
self-replace = "1.5.0"
self_update = { version = "0.42.0", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2"] }
serde_json = "1.0.142"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
vmm-backend = { version = "0.2.0", path = "../vmm-backend" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13.3"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
