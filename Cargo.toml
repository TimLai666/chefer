[workspace]
members = [
    "crates/appcipe-spec",
    "crates/appcipe-normalize",
    "crates/chefer-pack",
    "crates/chefer-runtime",
    "crates/vmm-backend",
    "crates/whp-helper",
    "crates/guest-agent",
    "crates/chefer-cli", "crates/chefer-assembler", "crates/chefer-bundle",
]

# 讓所有 crate 共用同一套依賴版本（可避免衝突）
resolver = "2"
