# Chefer GUI demo: package an X11 graphical program (xeyes) into a single file.
#
# Before packaging, run scripts/build-images.sh (or .ps1) to produce images/gui.tar,
# then `chefer build examples/gui-demo/appcipe.yml`.
version: "0.1"
name: CheferGuiDemo
app_version: "1.0.0"

services:
  # interface_mode: gui -> chefer mounts the host's X11/Wayland socket into the container and sets DISPLAY:
  #   - Linux: passes through /tmp/.X11-unix and $XDG_RUNTIME_DIR/wayland-*.
  #   - Windows: via WSLg (inside the distro /tmp/.X11-unix -> /mnt/wslg/.X11-unix, DISPLAY=:0).
  # No ports (a GUI does not need an exposed port), and no persistence needed.
  eyes:
    image: ./images/gui.tar
    interface_mode: gui
