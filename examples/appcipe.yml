version: "0.1"                      # Required: spec format version (currently fixed at "0.1")

# === Header (app-level) ===
name: StudioPro                     # Required: app name; also used as the output single-file name and the data directory name
                                    #   Rule: [A-Za-z][A-Za-z0-9_-]*, max 64 chars
app_version: "2.3.1"                # Optional: app version; display-only (does not affect parsing or packing)
old_names: ["Studio", "StudioBeta"] # Optional: list of old folder names; if the new data dir doesn't exist, these are tried in order and auto-renamed (migrated)
data_dir: "D:/Apps/StudioPro"       # Optional: override the default data directory location; if unset, the system default is used
                                    #   Windows: %LOCALAPPDATA%/{name}
                                    #   macOS:   ~/Library/Application Support/{name}
                                    #   Linux:   $XDG_DATA_HOME/{name} or ~/.local/share/{name}
crash: fail_fast                    # Optional: crash policy; only fail_fast is supported (any service exiting non-zero -> whole app exits with that exit code)
                                    #   Legacy field name crash_policy is still accepted (serde alias)
network: bridge                     # Optional: network mode (default bridge). One of:
                                    #   bridge   — app-private network, only declared ports: are open, outbound allowed (NAT, like Docker's default); default
                                    #   internal — same as bridge but with NO outbound network (like Docker Compose's internal: true)
                                    #   shared   — shares the host network; undeclared ports are also reachable from the host (not isolated; legacy behavior)
                                    #   Note: omitting this field = bridge = isolated. To restore "undeclared ports reachable from the host", set shared explicitly.
                                    #   bridge outbound needs pasta in the kit (the official release kit ships it); without pasta it degrades to internal at runtime.
console: auto                       # Optional: shared-console (aggregated logs + Ctrl-C terminal window) display policy (default auto). One of:
                                    #   auto   — has a terminal/both service -> shown; gui-only -> hidden (when double-clicked on Windows); no interface at all -> shown (keeps a way to stop); default
                                    #   shown  — always show the shared console
                                    #   hidden — hide the shared console (only allowed if the app also has a gui or terminal/both to close it; using hidden with no interface fails validation)
                                    #   Hiding only takes effect when double-clicked to launch on Windows (and only when this process owns the console exclusively); launching from an existing terminal, or other platforms, are unaffected.

# === Service definitions ===
services:

  db:                                # Service name; rule: [a-z][a-z0-9_]*, max 32 chars
    # --- Image source ---
    # One of: source: tar (local docker save / OCI archive), source: image (pulled from a registry at build time),
    #         source: dockerfile (built on the packing machine at build time via docker/podman/nerdctl).
    # Simplest: just give a registry ref -> image: postgres:16-alpine (see the app1 short-form example below).
    image:                           # Required: container image source
      source: tar                    # tar = image tar file; image = pull from a registry; dockerfile = build from a Dockerfile
      file: ./images/postgres16.tar  # source=tar: tar path (may be relative to appcipe.yml; both docker save and OCI archive are accepted, auto-detected)
                                     # For source=image, file holds a registry ref instead, and it must be pinned:
                                     #   postgres:16-alpine (explicit tag, not latest) or …@sha256:<digest>;
                                     #   untagged or :latest is rejected (for reproducibility). Public images are pulled anonymously.
                                     # For source=dockerfile, file holds a Dockerfile path instead; you may also add:
                                     #   context: <build context dir; omitted = the Dockerfile's directory>
                                     #   build_args: { KEY: VALUE } (-> --build-arg)
                                     #   Note: dockerfile requires docker/podman/nerdctl on the packing machine and isn't guaranteed reproducible (for reproducibility use source: image with a pinned digest).
      format: auto                   # Optional: auto | docker-archive | oci-archive (default auto; only meaningful for source=tar)
      platform: linux/amd64          # Optional: default linux/amd64; selects the platform from a multi-arch source (linux/arm64 also supported)

    # --- Execution parameters ---
    cmd: ["postgres", "-c", "max_connections=200"]  # Optional: overrides the image's Cmd (does not replace Entrypoint, same semantics as Docker); string or array
    workdir: /var/lib/postgresql/data               # Optional: working directory inside the container
    env:                                           # Optional: environment variables (key: value; merged with the image's built-in env, these take precedence)
      POSTGRES_PASSWORD: "pw"
      PGDATA: "/var/lib/postgresql/data"

    # --- Persistence (only persisted if persist_path is set) ---
    persist_path: /var/lib/postgresql/data         # Optional: in-container path to persist (must start with /)
                                                   #   Actual host path: {data_dir or system default}/data/db/

    # --- Ports (host:guest[/proto]; default tcp) ---
    ports: ["5432:5432"]                           # Optional: mapped to localhost; when host≠guest the runtime forwards via a TCP proxy
                                                   #   Host ports must be unique within an app
                                                   #   Note: UDP mappings currently don't work on Windows (WSL2 localhost forwarding limitation)

    # --- Health check (optional; drives depends_on wait-until-ready, semantics aligned with Docker HEALTHCHECK) ---
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"] # Command array (CMD=direct argv; CMD-SHELL=sh -c) or string (= sh -c); exit 0 = healthy
      interval: 2s                                  # Optional: interval between checks (default 2s). Accepts <n>ms/<n>s/<n>m or a bare integer (seconds)
      timeout: 5s                                   # Optional: per-check timeout (default 5s)
      retries: 10                                   # Optional: consecutive failures before unhealthy -> fail_fast (default 10)
      start_period: 0s                              # Optional: grace period during which failures don't count toward retries (default 0s)

    # --- Terminal/GUI ---
    interface_mode: none                           # Optional: gui | terminal | both | none (default none)

  ui:
    # Short-form example: image is a tar path directly (equivalent to source: tar + format: auto + default platform)
    image: ./images/studio-ui.tar                  # Required (for this form): tar file path

    cmd: ["sh", "-lc", "chmod +x /app/start && /app/start"]  # Optional
    env:
      API_URL: "http://localhost:8080"
    workdir: /app                                  # Optional

    # Bind mounts: explicitly expose specific host folders to the container (not the same as persistence)
    mounts:                                        # Optional: each entry "<host_path>:<container_path>"
      - ./presets:/app/presets                     # Host relative path (relative to appcipe.yml): the in-container path must start with /
      - /bigdata:/mnt/data                         # Host absolute path (Windows drive letters like C:\data also work; quoting recommended)
      # Note: host paths are validated to exist before startup; a missing path is an error

    ports:
      - "8080:8080"                                # Multi-line form example
      - "9000:9000/udp"                            # UDP suffix example (no effect on Windows, see above)

    interface_mode: gui   # Optional: terminal | gui | both | none (default none)
                          #   gui: Linux passes through the X11/Wayland socket; Windows relies on WSLg (best-effort)
                          #   terminal/both: stdin passthrough; an app may have at most one terminal/both service
    depends_on:
      - db

  worker:
    image:
      source: tar
      file: ./images/worker.tar
      format: auto
    cmd: "sh -lc 'echo worker running; sleep 3600'" # String form example (run as /bin/sh -c)
    env:
      LOG_LEVEL: "info"
    # persist_path not set -> not persisted (wiped on exit)
    mounts: []                                     # An empty list is also valid; equivalent to no bind mounts
    ports: []                                      # No exposed ports
    interface_mode: none
    depends_on:
      - db
      - ui

# === Behavior notes ===
# 1) Launch the single file -> services are started in depends_on topological order. If a service has a healthcheck,
#    the next one waits until it's healthy (i.e. depends_on wait-until-ready); a service without a healthcheck is considered ready once spawned.
#    Any service exiting abnormally (exit code ≠ 0) or exhausting healthcheck retries -> fail_fast (terminate the rest and exit the whole app).
# 2) All services finishing normally (exit code 0) -> the whole app exits 0; Ctrl-C / closing the terminal -> terminate all services, then exit.
# 3) Actual location of persisted folders:
#    {data_dir or system default (including {name})}/data/{service_name}/...
#    e.g. Linux default: ~/.local/share/StudioPro/data/db/
# 4) Folder migration:
#    If the new data dir doesn't exist, old folders are searched in old_names order and auto-renamed to the new {name}.
# 5) YAML arrays may use inline or multi-line form; the parser treats them as equivalent.
