# Chefer demo: app + database, showcasing registry pull, internal networking, data persistence, and a db that is not exposed externally.
#
# The db is pulled straight from the registry (no docker save needed); just run scripts/build-images.sh (or .ps1)
# first to produce images/app.tar, then `chefer build examples/demo/appcipe.yml`.
version: "0.1"
name: CheferDemo
app_version: "1.0.0"

services:
  # Database: official redis, **pulled straight from the registry** (no docker save). Pin the tag for reproducibility.
  # No ports -> it is never bridged out; the default network: bridge gives this app its own netns,
  # so the db is genuinely unreachable from the host (internal only). app connects to it at 127.0.0.1:6379 (services in the same app share the netns).
  # The healthcheck gates dependents: app will not start until Redis answers PING.
  # Note: the official redis entrypoint does chown/gosu to redis uid 999 -- this works on WSL2 / macOS VM /
  # native Linux running as root; on native Linux rootless, the single-uid mapping makes it fail (see Roadmap).
  db:
    image: redis:7.2-alpine        # pulled from the registry (pin the tag, no latest); no docker save needed
    cmd: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes", "--dir", "/data"]
    persist_path: /data            # redis's AOF lands here, so data survives app restarts
    interface_mode: none
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Application: an HTTP service that connects to db to keep a count. Only this service exposes a port (18080 -> 8080 inside the container).
  app:
    image: ./images/app.tar
    env:
      REDIS_HOST: "127.0.0.1"      # internal network: shares the network namespace with db
      REDIS_PORT: "6379"
      PORT: "8080"
    ports: ["18080:8080"]          # the only externally exposed port
    interface_mode: none
    depends_on: [db]               # wait until db's healthcheck is healthy, then start app
