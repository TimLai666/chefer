# Chefer demo: PySide6 GUI + redis, two containers packed into a single file.
#
# The db is pulled straight from the registry (no docker save needed); just run scripts/build-images.sh (or .ps1)
# first to produce images/gui.tar, then `chefer build examples/pyside-redis/appcipe.yml`.
version: "0.1"
name: CheferPysideRedis
app_version: "1.0.0"

services:
  # Database: official redis, **pulled straight from the registry** (no docker save). Pin the tag for reproducibility.
  # Default network: bridge -> this app gets its own netns, and db has no ports: -> it is genuinely unreachable from the host.
  # The official redis entrypoint does chown/gosu to redis uid 999: works on WSL2/VM/native-root,
  # native Linux rootless needs newuidmap delegation (see Roadmap).
  db:
    image: redis:7.2-alpine        # pulled from the registry (pin the tag, no latest)
    cmd: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes", "--dir", "/data"]
    persist_path: /data
    interface_mode: none

  # GUI: a PySide6 window that connects to the same app's redis (127.0.0.1, internal network).
  gui:
    image: ./images/gui.tar
    interface_mode: gui          # chefer mounts the X11/Wayland socket and sets DISPLAY
    env:
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
    depends_on: [db]
