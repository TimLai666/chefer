name: Release (build & attach kits)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing git tag to build and verify without uploading to a GitHub Release
        required: true
        type: string
      linux_ref:
        description: 建置 macOS micro-VM appliance 使用的 Linux stable git tag/ref
        required: false
        default: v6.6.32
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 讓所有 JS actions 在 Node 24 上跑（checkout/cache/artifact 的 Node 20 已棄用）。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CHEFER_LINUX_REF: ${{ inputs.linux_ref || vars.CHEFER_LINUX_REF || 'v6.6.32' }}

jobs:
  preflight:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.tag.outputs.checkout_ref }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
      linux_ref: ${{ steps.tag.outputs.linux_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$EVENT_TAG"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$TAG" == "." || "$TAG" == ".." ]]; then
            echo "::error::Release tag is not safe for asset filenames: $TAG"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::Release tag does not exist or does not resolve to a commit: $TAG"
            exit 1
          fi
          LINUX_REF="${CHEFER_LINUX_REF}"
          if [[ -z "$LINUX_REF" || "$LINUX_REF" == *".."* || "$LINUX_REF" == *" "* ]]; then
            echo "::error::Linux appliance ref is not safe: $LINUX_REF"
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "linux_ref=$LINUX_REF" >> "$GITHUB_OUTPUT"

  # ── 第一階段：各 target 編譯 chefer-cli / chefer-runtime（Windows 加 WHP helper；musl target 加 guest-agent）──
  build:
    name: build (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc,      cross: false, agent: false }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc,     cross: false, agent: false }
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-musl,   cross: true,  agent: true }
          - { runner: ubuntu-latest,  target: aarch64-unknown-linux-musl,  cross: true,  agent: true }
          - { runner: macos-latest,   target: x86_64-apple-darwin,         cross: false, agent: false }
          - { runner: macos-latest,   target: aarch64-apple-darwin,        cross: false, agent: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build chefer-cli & chefer-runtime
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p chefer-cli -p chefer-runtime
          else
            cargo build --release --target ${{ matrix.target }} -p chefer-cli -p chefer-runtime
          fi

      - name: Build WHP helper (Windows targets)
        if: contains(matrix.target, 'windows')
        run: cargo build --release --target ${{ matrix.target }} -p whp-helper

      - name: Build guest-agent (musl static)
        if: matrix.agent
        run: cross build --release --target ${{ matrix.target }} -p guest-agent

      - name: Stage binaries
        shell: bash
        run: |
          T="${{ matrix.target }}"
          EXT=""
          [[ "$T" == *windows* ]] && EXT=".exe"
          mkdir -p stage
          cp "target/$T/release/chefer-cli$EXT" "stage/chefer-cli-$T$EXT"
          cp "target/$T/release/chefer-runtime$EXT" "stage/chefer-runtime-$T$EXT"
          if [[ "$T" == *windows* ]]; then
            ARCH="${T%%-*}"   # x86_64 / aarch64
            cp "target/$T/release/chefer-whp-helper$EXT" "stage/chefer-whp-helper-$ARCH$EXT"
          fi
          if [[ "${{ matrix.agent }}" == "true" ]]; then
            ARCH="${T%%-*}"   # x86_64 / aarch64
            cp "target/$T/release/guest-agent" "stage/guest-agent-$ARCH"
          fi

      # macOS 目標：編 + 簽（virtualization entitlement）vz 開機 helper（host macho）。
      # swiftc 可在 arm64 runner 上交叉編到 x86_64，故兩個 darwin 目標各自產對應架構的 helper。
      # 註：此處為 ad-hoc 簽章；正式對外散布尚需 Developer ID 簽章 + notarization（待 secrets 接上）。
      - name: Build + sign vz helper (macOS targets)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          ARCH="${{ matrix.target }}"; ARCH="${ARCH%%-*}"   # x86_64 / aarch64
          bash scripts/build-vz-helper.sh --arch "$ARCH" stage

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error

  appliance:
    name: build appliance (${{ matrix.arch }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Build Linux micro-VM appliance
        shell: bash
        run: bash scripts/build-appliance.sh --arch "${{ matrix.arch }}" --linux-ref "${{ needs.preflight.outputs.linux_ref }}" --out stage

      - uses: actions/upload-artifact@v7
        with:
          name: appliance-${{ matrix.arch }}
          path: |
            stage/chefer-vmlinuz-${{ matrix.arch }}
            stage/chefer-initramfs-${{ matrix.arch }}
            stage/BUILDINFO-${{ matrix.arch }}
            stage/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error

  # 靜態 musl pasta（bridge 網路模式的出網 NAT）；兩 guest 架構各一支。
  pasta:
    name: build pasta (${{ matrix.arch }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      # aarch64 以 docker --platform 經 qemu binfmt 建置。
      - name: Set up QEMU (for cross-arch pasta build)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build static pasta
        shell: bash
        run: bash scripts/build-pasta.sh --arch "${{ matrix.arch }}" --out stage

      - uses: actions/upload-artifact@v7
        with:
          name: pasta-${{ matrix.arch }}
          path: |
            stage/pasta-${{ matrix.arch }}
            stage/SHA256SUMS-pasta-${{ matrix.arch }}
          if-no-files-found: error

  # ── 第二階段：每個 host 平台組一份完整 kit（CLI + 全部 runtime + 兩架構 guest-agent + pasta）──
  package:
    name: package kit (${{ matrix.host_target }})
    needs: [preflight, build, appliance, pasta]
    strategy:
      fail-fast: false
      matrix:
        host_target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - uses: actions/download-artifact@v7
        with:
          path: all
          merge-multiple: true

      - name: Compose kit
        shell: bash
        run: |
          HT="${{ matrix.host_target }}"
          TAG="${{ needs.preflight.outputs.release_tag }}"
          EXT=""
          [[ "$HT" == *windows* ]] && EXT=".exe"
          case "$TAG" in
            ""|*/*|*\\*|*:*)
              echo "::error::Release tag is not safe for asset filenames: $TAG"
              exit 1
              ;;
          esac

          PKG="chefer_${TAG}_${HT}"
          mkdir -p "out/$PKG/kit"

          # host 的 CLI，改名為 chefer
          cp "all/chefer-cli-$HT$EXT" "out/$PKG/chefer$EXT"
          # 全部 target 的 runtime（跨平台打包用）
          cp all/chefer-runtime-* "out/$PKG/kit/"
          # 兩種 guest 架構的靜態 agent
          cp all/guest-agent-x86_64 all/guest-agent-aarch64 "out/$PKG/kit/"
          # 兩種 guest 架構的靜態 pasta（bridge 出網用）
          cp all/pasta-x86_64 all/pasta-aarch64 "out/$PKG/kit/"
          # macOS VZ 後端使用的 Linux micro-VM appliance（所有 host kit 都附，方便跨平台打包）
          cp all/chefer-vmlinuz-* all/chefer-initramfs-* "out/$PKG/kit/"
          # macOS VZ 開機 helper（兩種 darwin 架構；打包 macOS 目標時內嵌進 bundle agents/）
          cp all/chefer-vz-helper-x86_64 all/chefer-vz-helper-aarch64 "out/$PKG/kit/"
          # Windows WHP 開機 helper（兩種 windows host 架構；打包 Windows 目標時內嵌進 bundle agents/）
          cp all/chefer-whp-helper-x86_64.exe all/chefer-whp-helper-aarch64.exe "out/$PKG/kit/"
          cp all/BUILDINFO-* all/SHA256SUMS-* "out/$PKG/kit/"

          chmod +x "out/$PKG/chefer$EXT" out/$PKG/kit/* || true

          cd out
          if [[ "$HT" == *windows* ]]; then
            zip -r "$PKG.zip" "$PKG" >/dev/null
            sha256sum "$PKG.zip" > "$PKG.zip.sha256"
          else
            tar -czf "$PKG.tar.gz" "$PKG"
            sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
          fi
          rm -rf "$PKG"

      - name: Validate kit
        shell: bash
        run: bash scripts/verify-release-kit.sh out "${{ needs.preflight.outputs.release_tag }}" "${{ matrix.host_target }}"

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-kit-${{ matrix.host_target }}
          path: |
            out/*.zip
            out/*.zip.sha256
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            out/*.zip
            out/*.zip.sha256
            out/*.tar.gz
            out/*.tar.gz.sha256
